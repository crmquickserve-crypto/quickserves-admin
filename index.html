<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>QUICKSERVES OS - Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; }
    
    .sidebar { width: 280px; background-color: #1e293b; border-right: 1px solid #334155; overflow-y: auto; height: 100vh; position: fixed; }
    .sidebar-brand { font-size: 15px; font-weight: bold; color: #f8fafc; padding: 20px 16px; background: #172033; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #334155; }
    
    .menu-dropdown { border-bottom: 1px solid #334155; }
    .menu-header { padding: 14px 16px; color: #cbd5e1; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
    .menu-header:hover { background-color: #334155; color: #fff; }
    
    .submenu { display: none; background-color: #172033; padding: 4px 0; }
    .submenu.open { display: block; }
    .submenu-item { padding: 10px 16px 10px 42px; color: #94a3b8; font-size: 12px; cursor: pointer; transition: 0.2s; }
    .submenu-item:hover { color: #f8fafc; background-color: #1e293b; }
    .submenu-item.active { color: #818cf8; font-weight: 600; background-color: #1e293b; }

    .main { flex: 1; margin-left: 280px; padding: 32px; overflow-y: auto; }
    .header { font-size: 18px; font-weight: 700; color: #94a3b8; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    
    .panel-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 24px; }
    .section-title { font-size: 13px; font-weight: 600; color: #38bdf8; margin: 24px 0 14px 0; border-bottom: 1px solid #334155; padding-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; }
    .required { color: #ef4444; margin-left: 2px; }
    input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 9px 12px; border-radius: 4px; font-size: 13px; }
    textarea { resize: vertical; height: 75px; }
    
    .btn-container { display: flex; gap: 10px; margin: 20px 0; }
    .btn-primary { background-color: #007bff; color: white; border: none; padding: 8px 18px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-primary:hover { background-color: #0056b3; }
    .btn-success { background-color: #22c55e; color: white; border: none; padding: 10px 24px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-success:hover { background-color: #16a34a; }
    .btn-danger { background-color: #ff3366; color: white; border: none; padding: 8px 18px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-danger:hover { background-color: #e02e5b; }
    .btn-warning { background-color: #eab308; color: #0f172a; border: none; padding: 10px 24px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px; }
    
    table { width: 100%; border-collapse: collapse; background-color: #1e293b; border: 1px solid #334155; margin-top: 10px; }
    th { text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 700; color: #007bff; border-bottom: 2px solid #334155; text-transform: uppercase; background: #172033; }
    td { padding: 12px 16px; font-size: 13px; color: #38bdf8; border-bottom: 1px solid #334155; }
    tr:hover { background-color: #26334d; }
  </style>
</head>
<body>

  <!-- ADMIN SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-brand">🏠 Admin Dashboard</div>

    <!-- MASTER MENU -->
    <div class="menu-dropdown">
      <div class="menu-header" onclick="toggleSubmenu('masterSub')"><span>📄 Master</span> <span>▼</span></div>
      <div class="submenu open" id="masterSub">
        <div class="submenu-item active" onclick="switchView('Branch Master', this)">Branch Master</div>
        <div class="submenu-item" onclick="switchView('Franchise Master', this)">Franchise Master</div>
        <div class="submenu-item" onclick="switchView('Freelancer Master', this)">Freelancer Master</div>
        <div class="submenu-item" onclick="switchView('Technician Master', this)">Technician Master</div>
        <div class="submenu-item" onclick="switchView('Brand Mapping', this)">Brand Mapping</div>
        <div class="submenu-item" onclick="switchView('Category Mapping', this)">Category Mapping</div>
        <div class="submenu-item" onclick="switchView('Pincode Mapping', this)">Pincode Mapping</div>
        <div class="submenu-item" onclick="switchView('Client Master', this)">Client Master</div>
      </div>
    </div>

    <!-- CALL MANAGEMENT -->
    <div class="menu-dropdown">
      <div class="menu-header" onclick="toggleSubmenu('callSub')"><span>💻 Call Management</span> <span>▼</span></div>
      <div class="submenu" id="callSub">
        <div class="submenu-item" onclick="switchView('Call Registration', this)">Call Registration</div>
        <div class="submenu-item" onclick="switchView('Call View', this)">Call View</div>
      </div>
    </div>
  </div>

  <!-- MAIN AREA -->
  <div class="main">
    <div class="header" id="currentTitle">Branch Master</div>
    <div id="dynamicContentArea" class="panel-card"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://uknhaaxrzuzoxoifocsh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_MzqXS2rfG9-axSCwX3MYtQ_23dbTkG9';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function toggleSubmenu(id) {
      document.getElementById(id).classList.toggle('open');
    }

    function switchView(title, el) {
      document.querySelectorAll('.submenu-item').forEach(item => item.classList.remove('active'));
      if(el) el.classList.add('active');
      
      document.getElementById('currentTitle').innerText = title;
      var contentArea = document.getElementById('dynamicContentArea');
      
      if (title === 'Branch Master') {
        contentArea.innerHTML = `
          <div class="btn-container">
            <button class="btn-primary" onclick="loadAddBranchForm()">ADD</button>
            <button class="btn-danger" onclick="alert('Upload Document clicked')">Upload Document</button>
          </div>
          <table>
            <thead>
              <tr>
                <th style="width: 80px;">Select</th>
                <th style="width: 80px;">Edit</th>
                <th>Region</th>
              </tr>
            </thead>
            <tbody id="branchTableBody">
              <tr><td><input type="checkbox"></td><td>📝</td><td>East</td></tr>
              <tr><td><input type="checkbox"></td><td>📝</td><td>West</td></tr>
              <tr><td><input type="checkbox"></td><td>📝</td><td>North</td></tr>
              <tr><td><input type="checkbox"></td><td>📝</td><td>South</td></tr>
            </tbody>
          </table>`;
      } 
      else if (title === 'Franchise Master') {
        contentArea.innerHTML = `
          <div class="btn-container">
            <button class="btn-primary" onclick="loadAddFranchiseForm()">ADD FRANCHISE</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>Select</th>
                <th>Edit</th>
                <th>Firm Name</th>
                <th>Region</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="franchiseTableBody">
              <tr><td colspan="5">No franchises added yet. Click ADD FRANCHISE.</td></tr>
            </tbody>
          </table>`;
      }
      else {
        contentArea.innerHTML = `
          <h3 style="font-size:16px; color:#818cf8; margin-bottom:10px;">${title} Panel</h3>
          <p style="color:#cbd5e1; font-size:13px;">Yeh module successfully linked hai aur active hai.</p>`;
      }
    }

    function loadAddBranchForm() {
      document.getElementById('currentTitle').innerText = 'Add Branch';
      document.getElementById('dynamicContentArea').innerHTML = `
        <form id="addBranchForm" onsubmit="saveBranch(event)">
          <div class="form-grid">
            <div class="form-group">
              <label>Region</label>
              <select id="region" required>
                <option value="">----Select----</option>
                <option value="North">North</option>
                <option value="South">South</option>
                <option value="East">East</option>
                <option value="West">West</option>
              </select>
            </div>
            <div class="form-group">
              <label>Branch</label>
              <input type="text" id="branch_name" placeholder="Enter Branch Name" required>
            </div>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label>Address</label>
              <textarea id="address" placeholder="Enter Full Address"></textarea>
            </div>
            <div class="form-group">
              <label>Landmark</label>
              <input type="text" id="landmark" placeholder="Enter Landmark">
            </div>
          </div>
          <div class="btn-container">
            <button type="submit" class="btn-primary">Save</button>
            <button type="button" class="btn-danger" onclick="switchView('Branch Master', document.querySelector('.submenu-item'))">Back</button>
          </div>
        </form>`;
    }

    function loadAddFranchiseForm() {
      document.getElementById('currentTitle').innerText = 'Add Franchise';
      document.getElementById('dynamicContentArea').innerHTML = `
        <form id="addFranchiseForm" onsubmit="saveFranchise(event)">
          <div class="form-grid">
            <div class="form-group">
              <label>Region<span class="required">*</span></label>
              <select id="f_region" required>
                <option value="">----Select----</option>
                <option value="North">North</option>
                <option value="South">South</option>
                <option value="East">East</option>
                <option value="West">West</option>
              </select>
            </div>
            <div class="form-group">
              <label>Firm Type<span class="required">*</span></label>
              <select id="f_firm_type" required>
                <option value="">---select---</option>
                <option value="Proprietorship">Proprietorship</option>
                <option value="Partnership">Partnership</option>
              </select>
            </div>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label>Firm Name<span class="required">*</span></label>
              <input type="text" id="f_firm_name" placeholder="Enter Firm Name" required>
            </div>
            <div class="form-group">
              <label>Contact Number<span class="required">*</span></label>
              <input type="text" id="f_contact" placeholder="Enter Contact Number" required>
            </div>
          </div>
          <div class="btn-container">
            <button type="submit" class="btn-success">Save Franchise</button>
            <button type="button" class="btn-warning" onclick="switchView('Franchise Master', document.querySelectorAll('.submenu-item')[1])">Back</button>
          </div>
        </form>`;
    }

    async function saveBranch(event) {
      event.preventDefault();
      alert('Branch saved successfully!');
      switchView('Branch Master', document.querySelector('.submenu-item'));
    }

    async function saveFranchise(event) {
      event.preventDefault();
      alert('Franchise saved successfully!');
      switchView('Franchise Master', document.querySelectorAll('.submenu-item')[1]);
    }

    window.onload = function() {
      switchView('Branch Master', document.querySelector('.submenu-item'));
    };
  </script>
</body>
</html>
