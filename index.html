<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Branch - Quickserves Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">

    <div class="max-w-6xl mx-auto p-6 bg-slate-800 rounded-xl shadow-2xl my-10 border border-slate-700">
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <h1 class="text-2xl font-bold text-emerald-400">Add New Branch</h1>
            <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm transition">Back to Dashboard</a>
        </div>

        <form id="branchForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Region -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Region *</label>
                    <select name="region" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none">
                        <option value="">----Select----</option>
                        <option value="North">North</option>
                        <option value="South">South</option>
                        <option value="East">East</option>
                        <option value="West">West</option>
                        <option value="Central">Central</option>
                    </select>
                </div>

                <!-- Branch Name -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Branch Name *</label>
                    <input type="text" name="branch_name" required placeholder="Enter Branch Name" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none">
                </div>

                <!-- Address -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-1">Address *</label>
                    <textarea name="address" rows="2" required placeholder="Enter Full Address" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none"></textarea>
                </div>

                <!-- Landmark -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Landmark</label>
                    <input type="text" name="landmark" placeholder="Enter Landmark" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none">
                </div>

                <!-- Pincode -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Pincode *</label>
                    <input type="text" id="pincodeInput" name="pincode" maxlength="6" required placeholder="Enter 6-digit Pincode" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none">
                </div>

                <!-- State -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">State *</label>
                    <input type="text" id="stateInput" name="state" required placeholder="Auto-filled by Pincode" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none">
                </div>

                <!-- District -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">District *</label>
                    <input type="text" id="districtInput" name="district" required placeholder="Auto-filled by Pincode" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none">
                </div>

                <!-- City -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">City *</label>
                    <input type="text" id="cityInput" name="city" required placeholder="Auto-filled by Pincode" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none">
                </div>

                <!-- Locality -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Locality *</label>
                    <select id="localitySelect" name="locality" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none">
                        <option value="">----Select Pincode First----</option>
                    </select>
                </div>

            </div>

            <!-- Submit Button -->
            <div class="pt-4 border-t border-slate-700 flex justify-end">
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-3 rounded-lg shadow-lg transition">Save Branch</button>
            </div>
        </form>
    </div>

    <!-- Script for Pincode Auto-Fill & Supabase Insertion -->
    <script>
        // Pincode API Integration
        document.getElementById('pincodeInput').addEventListener('blur', async function() {
            let pincode = this.value.trim();
            if (pincode.length === 6) {
                try {
                    let response = await fetch(`https://api.postalpincode.in/pincode/${pincode}`);
                    let data = await response.json();
                    
                    if (data[0].Status === "Success") {
                        let details = data[0].PostOffice[0];
                        
                        // Auto-fill State, District, City
                        document.getElementById('stateInput').value = details.State || '';
                        document.getElementById('districtInput').value = details.District || '';
                        document.getElementById('cityInput').value = details.Block || details.District || '';

                        // Populate Locality dropdown with all available post offices/areas
                        let localitySelect = document.getElementById('localitySelect');
                        localitySelect.innerHTML = '<option value="">----Select Locality----</option>';
                        
                        data[0].PostOffice.forEach(po => {
                            let opt = document.createElement('option');
                            opt.value = po.Name;
                            opt.textContent = `${po.Name} (${po.BranchType})`;
                            localitySelect.appendChild(opt);
                        });
                    } else {
                        alert('Invalid Pincode! Please check.');
                        document.getElementById('stateInput').value = '';
                        document.getElementById('districtInput').value = '';
                        document.getElementById('cityInput').value = '';
                        document.getElementById('localitySelect').innerHTML = '<option value="">----Select Pincode First----</option>';
                    }
                } catch (error) {
                    console.error('Error fetching pincode data:', error);
                }
            }
        });

        // Supabase Integration (Replace with your actual keys if needed)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('branchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            const { error } = await supabaseClient.from('branches').insert([data]);

            if (error) {
                alert('Error saving branch: ' + error.message);
            } else {
                alert('Branch saved successfully!');
                e.target.reset();
                document.getElementById('localitySelect').innerHTML = '<option value="">----Select Pincode First----</option>';
            }
        });
    </script>
</body>
</html>
