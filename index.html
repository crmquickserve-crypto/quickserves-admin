<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Master - Quickserves OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0f172a] text-[#f8fafc] font-sans min-h-screen flex">

    <!-- Complete Original Sidebar with All Masters -->
    <div class="w-64 bg-[#1e293b] border-r border-[#334155] h-screen fixed left-0 top-0 overflow-y-auto">
        <div class="text-sm font-bold text-[#f8fafc] p-4 bg-[#172033] flex items-center gap-2 border-b border-[#334155]">
            Admin Dashboard
        </div>
        <nav class="p-2 space-y-1">
            <div class="flex justify-between items-center px-3 py-2 text-xs font-semibold text-slate-400 uppercase cursor-pointer hover:text-white">
                <span>Master</span>
                <span>▼</span>
            </div>
            <div class="pl-2 space-y-1">
                <a href="branch-add.html" class="block px-3 py-1.5 rounded text-sm bg-blue-600 text-white font-medium">Branch Master</a>
                <a href="franchise-add.html" class="block px-3 py-1.5 rounded text-sm text-slate-300 hover:bg-slate-800">Franchise Master</a>
                <a href="freelancer-add.html" class="block px-3 py-1.5 rounded text-sm text-slate-300 hover:bg-slate-800">Freelancer Master</a>
                <a href="technician-add.html" class="block px-3 py-1.5 rounded text-sm text-slate-300 hover:bg-slate-800">Technician Master</a>
                <a href="#" class="block px-3 py-1.5 rounded text-sm text-slate-300 hover:bg-slate-800">Brand Mapping</a>
                <a href="#" class="block px-3 py-1.5 rounded text-sm text-slate-300 hover:bg-slate-800">Category Mapping</a>
                <a href="#" class="block px-3 py-1.5 rounded text-sm text-slate-300 hover:bg-slate-800">Pincode Mapping</a>
                <a href="#" class="block px-3 py-1.5 rounded text-sm text-slate-300 hover:bg-slate-800">Client Master</a>
                <a href="#" class="block px-3 py-1.5 rounded text-sm text-slate-300 hover:bg-slate-800">Category Master</a>
                <a href="#" class="block px-3 py-1.5 rounded text-sm text-slate-300 hover:bg-slate-800">Product Master</a>
                <a href="#" class="block px-3 py-1.5 rounded text-sm text-slate-300 hover:bg-slate-800">Model Master</a>
                <a href="#" class="block px-3 py-1.5 rounded text-sm text-slate-300 hover:bg-slate-800">Symptom Master</a>
                <a href="#" class="block px-3 py-1.5 rounded text-sm text-slate-300 hover:bg-slate-800">Cause Master</a>
                <a href="#" class="block px-3 py-1.5 rounded text-sm text-slate-300 hover:bg-slate-800">Analysis Master</a>
                <a href="#" class="block px-3 py-1.5 rounded text-sm text-slate-300 hover:bg-slate-800">Spares Master</a>
            </div>
        </nav>
    </div>

    <!-- Main Content Area (ml-64 taaki sidebar ke sath overlap na ho) -->
    <div class="ml-64 flex-1 p-8">
        <div class="max-w-5xl mx-auto bg-[#1e293b] rounded-xl shadow-2xl border border-[#334155] p-6">
            
            <div class="flex justify-between items-center mb-6 border-b border-[#334155] pb-4">
                <h1 class="text-xl font-bold text-emerald-400">Add Branch</h1>
                <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm transition">Back</a>
            </div>

            <form id="branchForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <!-- Region -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">REGION *</label>
                        <select name="region" required class="w-full bg-[#0f172a] border border-[#334155] rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none">
                            <option value="">----Select----</option>
                            <option value="North">North</option>
                            <option value="South">South</option>
                            <option value="East">East</option>
                            <option value="West">West</option>
                            <option value="Central">Central</option>
                        </select>
                    </div>

                    <!-- Branch Name -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">BRANCH *</label>
                        <input type="text" name="branch_name" required placeholder="Enter Branch Name" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none">
                    </div>

                    <!-- Address -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-slate-300 mb-1">ADDRESS *</label>
                        <textarea name="address" rows="2" required placeholder="Enter Full Address" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none"></textarea>
                    </div>

                    <!-- Landmark -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">LANDMARK</label>
                        <input type="text" name="landmark" placeholder="Enter Landmark" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none">
                    </div>

                    <!-- Pincode -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">PINCODE *</label>
                        <input type="text" id="pincodeInput" name="pincode" maxlength="6" required placeholder="Enter 6-digit Pincode" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none">
                    </div>

                    <!-- State -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">STATE *</label>
                        <input type="text" id="stateInput" name="state" required placeholder="Auto-filled by Pincode" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none">
                    </div>

                    <!-- District -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">DISTRICT *</label>
                        <input type="text" id="districtInput" name="district" required placeholder="Auto-filled by Pincode" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none">
                    </div>

                    <!-- City -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">CITY *</label>
                        <input type="text" id="cityInput" name="city" required placeholder="Auto-filled by Pincode" class="w-full bg-[#0f172a] border border-[#334155] rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none">
                    </div>

                    <!-- Locality -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">LOCALITY *</label>
                        <select id="localitySelect" name="locality" required class="w-full bg-[#0f172a] border border-[#334155] rounded-lg p-2.5 text-white focus:border-emerald-500 focus:outline-none">
                            <option value="">----Select Pincode First----</option>
                        </select>
                    </div>

                </div>

                <!-- Submit Button -->
                <div class="pt-4 border-t border-[#334155] flex justify-end">
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2.5 rounded-lg shadow-lg transition">Save Branch</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script: Pincode Auto-Fill & Supabase -->
    <script>
        // India Post API Integration for accurate City, State, District based on Pincode
        document.getElementById('pincodeInput').addEventListener('blur', async function() {
            let pincode = this.value.trim();
            if (pincode.length === 6) {
                try {
                    let response = await fetch(`https://api.postalpincode.in/pincode/${pincode}`);
                    let data = await response.json();
                    
                    if (data[0].Status === "Success") {
                        let details = data[0].PostOffice[0];
                        
                        document.getElementById('stateInput').value = details.State || '';
                        document.getElementById('districtInput').value = details.District || '';
                        document.getElementById('cityInput').value = details.Block || details.District || '';

                        let localitySelect = document.getElementById('localitySelect');
                        localitySelect.innerHTML = '<option value="">----Select Locality----</option>';
                        
                        data[0].PostOffice.forEach(po => {
                            let opt = document.createElement('option');
                            opt.value = po.Name;
                            opt.textContent = `${po.Name} (${po.BranchType})`;
                            localitySelect.appendChild(opt);
                        });
                    } else {
                        alert('Invalid Pincode! Please check.');
                        document.getElementById('stateInput').value = '';
                        document.getElementById('districtInput').value = '';
                        document.getElementById('cityInput').value = '';
                        document.getElementById('localitySelect').innerHTML = '<option value="">----Select Pincode First----</option>';
                    }
                } catch (error) {
                    console.error('Error fetching pincode data:', error);
                }
            }
        });

        // Supabase Configuration
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('branchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            const { error } = await supabaseClient.from('branches').insert([data]);

            if (error) {
                alert('Error saving branch: ' + error.message);
            } else {
                alert('Branch saved successfully!');
                e.target.reset();
                document.getElementById('localitySelect').innerHTML = '<option value="">----Select Pincode First----</option>';
            }
        });
    </script>
</body>
</html>
