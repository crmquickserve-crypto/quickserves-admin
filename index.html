<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Master Form - Quickserves CRM</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-section-title {
            background-color: #0d6efd;
            color: white;
            padding: 8px 15px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 4px;
            margin-bottom: 20px;
            margin-top: 30px;
        }
        .form-section-title:first-of-type {
            margin-top: 10px;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
    </style>
</head>
<body>

<div class="container my-5">
    <div class="card shadow-sm p-4">
        <h2 class="text-center mb-4 text-primary">Client Master Registration Form</h2>
        
        <form action="save_client.php" method="POST">
            
            <!-- 1. Basic & Company Information -->
            <div class="form-section-title">1. Company & Basic Information</div>
            <div class="row g-3">
                <div class="col-md-2">
                    <label for="client_code" class="form-label">Client Code</label>
                    <input type="text" class="form-control" id="client_code" name="client_code" placeholder="e.g. CDCL001" required>
                </div>
                <div class="col-md-5">
                    <label for="client_name" class="form-label">Client Name</label>
                    <input type="text" class="form-control" id="client_name" name="client_name" placeholder="Company Legal Name" required>
                </div>
                <div class="col-md-5">
                    <label for="proprietor_name" class="form-label">Proprietor Name</label>
                    <input type="text" class="form-control" id="proprietor_name" name="proprietor_name" placeholder="Proprietor / Director Name">
                </div>

                <div class="col-md-4">
                    <label for="cin_number" class="form-label">CIN Number</label>
                    <input type="text" class="form-control" id="cin_number" name="cin_number" placeholder="CIN Number">
                </div>
                <div class="col-md-4">
                    <label for="pan_number" class="form-label">PAN Number</label>
                    <input type="text" class="form-control" id="pan_number" name="pan_number" placeholder="PAN Number">
                </div>
                <div class="col-md-4">
                    <label for="gst_number" class="form-label">GST Number</label>
                    <input type="text" class="form-control" id="gst_number" name="gst_number" placeholder="GST Number">
                </div>
            </div>

            <!-- 2. Address & Location Details -->
            <div class="form-section-title">2. Address & Location Details</div>
            <div class="row g-3">
                <div class="col-md-12">
                    <label for="registered_address" class="form-label">Registered Address</label>
                    <textarea class="form-control" id="registered_address" name="registered_address" rows="2" placeholder="Full Registered Address"></textarea>
                </div>
                <div class="col-md-4">
                    <label for="landmark" class="form-label">Landmark</label>
                    <input type="text" class="form-control" id="landmark" name="landmark" placeholder="Landmark">
                </div>
                <div class="col-md-4">
                    <label for="locality" class="form-label">Locality</label>
                    <input type="text" class="form-control" id="locality" name="locality" placeholder="Locality">
                </div>
                <div class="col-md-4">
                    <label for="pincode" class="form-label">Pincode</label>
                    <input type="text" class="form-control" id="pincode" name="pincode" placeholder="Pincode">
                </div>

                <div class="col-md-3">
                    <label for="city" class="form-label">City</label>
                    <input type="text" class="form-control" id="city" name="city" placeholder="City">
                </div>
                <div class="col-md-3">
                    <label for="district" class="form-label">District</label>
                    <input type="text" class="form-control" id="district" name="district" placeholder="District">
                </div>
                <div class="col-md-3">
                    <label for="state" class="form-label">State</label>
                    <input type="text" class="form-control" id="state" name="state" placeholder="State">
                </div>
                <div class="col-md-3">
                    <label for="service_area" class="form-label">Service Area</label>
                    <input type="text" class="form-control" id="service_area" name="service_area" placeholder="Service Area">
                </div>
            </div>

            <!-- 3. Contact Details -->
            <div class="form-section-title">3. Contact Details</div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="contact_person" class="form-label">Contact Person</label>
                    <input type="text" class="form-control" id="contact_person" name="contact_person" placeholder="Contact Person Name">
                </div>
                <div class="col-md-3">
                    <label for="mobile_number" class="form-label">Mobile Number</label>
                    <input type="tel" class="form-control" id="mobile_number" name="mobile_number" placeholder="Mobile Number">
                </div>
                <div class="col-md-3">
                    <label for="landline_number" class="form-label">Landline Number</label>
                    <input type="text" class="form-control" id="landline_number" name="landline_number" placeholder="Landline Number">
                </div>
                <div class="col-md-3">
                    <label for="email_id" class="form-label">Email ID</label>
                    <input type="email" class="form-control" id="email_id" name="email_id" placeholder="Email Address">
                </div>
                <div class="col-md-4">
                    <label for="toll_free_number" class="form-label">Toll Free Number</label>
                    <input type="text" class="form-control" id="toll_free_number" name="toll_free_number" placeholder="Toll Free Number">
                </div>
            </div>

            <!-- 4. Call Center & Service Pricing -->
            <div class="form-section-title">4. Call Center & Service Charges</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="call_center" class="form-label">Call Center Name</label>
                    <input type="text" class="form-control" id="call_center" name="call_center" value="Quick Serves">
                </div>
                <div class="col-md-4">
                    <label for="no_of_call_centre_seat" class="form-label">No. Of Call Centre Seats</label>
                    <input type="number" class="form-control" id="no_of_call_centre_seat" name="no_of_call_centre_seat" placeholder="0">
                </div>
                <div class="col-md-4">
                    <label for="call_centre_seat_charge" class="form-label">Call Centre Seat Charge (PM)</label>
                    <input type="number" step="0.01" class="form-control" id="call_centre_seat_charge" name="call_centre_seat_charge" placeholder="0.00">
                </div>

                <div class="col-md-3">
                    <label for="crm_charges" class="form-label">CRM Charges</label>
                    <input type="number" step="0.01" class="form-control" id="crm_charges" name="crm_charges" placeholder="0.00">
                </div>
                <div class="col-md-3">
                    <label for="crm_extra_user_charges" class="form-label">CRM Extra User Charges</label>
                    <input type="number" step="0.01" class="form-control" id="crm_extra_user_charges" name="crm_extra_user_charges" placeholder="0.00">
                </div>
                <div class="col-md-3">
                    <label for="warehouse_charge_pm" class="form-label">Warehouse Charge PM</label>
                    <input type="number" step="0.01" class="form-control" id="warehouse_charge_pm" name="warehouse_charge_pm" placeholder="0.00">
                </div>
                <div class="col-md-3">
                    <label for="minimum_guaranty_pm" class="form-label">Minimum Guaranty PM</label>
                    <input type="number" step="0.01" class="form-control" id="minimum_guaranty_pm" name="minimum_guaranty_pm" placeholder="0.00">
                </div>

                <div class="col-md-6">
                    <label for="management_fee_yearly" class="form-label">Management Fee Yearly</label>
                    <input type="number" step="0.01" class="form-control" id="management_fee_yearly" name="management_fee_yearly" placeholder="0.00">
                </div>
                <div class="col-md-6">
                    <label for="local_conveyance_charge_per_km" class="form-label">Local Conveyance Charge Per KM</label>
                    <input type="text" class="form-control" id="local_conveyance_charge_per_km" name="local_conveyance_charge_per_km" placeholder="e.g. Rs. 5 Per KM">
                </div>
            </div>

            <!-- 5. Agreement & Commercial Terms -->
            <div class="form-section-title">5. Agreement & Commercial Terms</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="payment_terms" class="form-label">Payment Terms</label>
                    <input type="text" class="form-control" id="payment_terms" name="payment_terms" placeholder="e.g. Within 15 Days">
                </div>
                <div class="col-md-4">
                    <label for="credit_limit" class="form-label">Credit Limit</label>
                    <input type="text" class="form-control" id="credit_limit" name="credit_limit" placeholder="e.g. 6 Lac">
                </div>
                <div class="col-md-4">
                    <label for="credit_period" class="form-label">Credit Period</label>
                    <input type="text" class="form-control" id="credit_period" name="credit_period" placeholder="e.g. 6 Month">
                </div>

                <div class="col-md-3">
                    <label for="agreement_start_date" class="form-label">Agreement Start Date</label>
                    <input type="date" class="form-control" id="agreement_start_date" name="agreement_start_date">
                </div>
                <div class="col-md-3">
                    <label for="agreement_renewal_date" class="form-label">Agreement Renewal Date</label>
                    <input type="date" class="form-control" id="agreement_renewal_date" name="agreement_renewal_date">
                </div>
                <div class="col-md-3">
                    <label for="reconciliation_period" class="form-label">Reconciliation Period</label>
                    <input type="text" class="form-control" id="reconciliation_period" name="reconciliation_period" placeholder="e.g. Quarterly">
                </div>
                <div class="col-md-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" id="status" name="status">
                        <option value="A">Active (A)</option>
                        <option value="I">Inactive (I)</option>
                    </select>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary btn-lg px-5">Save Client Details</button>
            </div>

        </form>
    </div>
</div>

<!-- Bootstrap JS Bundle CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
