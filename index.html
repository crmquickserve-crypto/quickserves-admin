<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin CRM - Quickserves</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Sidebar (Restored to Original Design) -->
    <div class="w-64 bg-[#2d3a49] text-gray-200 h-screen fixed left-0 top-0 overflow-y-auto">
        <div class="p-4 bg-[#242e39] text-white font-bold text-center border-b border-gray-600">Admin Dashboard</div>

        <nav class="mt-2">
            <!-- Sidebar Items -->
            <div class="border-b border-gray-600">
                <button onclick="toggleMenu('masterMenu')" class="w-full flex items-center justify-between px-4 py-3 hover:bg-[#394858]">
                    <span>Master</span> <span>></span>
                </button>
                <div id="masterMenu" class="hidden bg-[#242e39] py-2 pl-6">
                    <a href="#" onclick="showSection('franchiseMasterSection')" class="block py-1 hover:text-white">Franchise Master</a>
                    <a href="#" class="block py-1 hover:text-white">Branch Master</a>
                    <a href="#" class="block py-1 hover:text-white">Technician Master</a>
                </div>
            </div>

            <div class="border-b border-gray-600">
                <button class="w-full flex items-center justify-between px-4 py-3 hover:bg-[#394858]">
                    <span>Call Management</span> <span>></span>
                </button>
            </div>

            <div class="border-b border-gray-600">
                <button onclick="toggleMenu('masterDataMenu')" class="w-full flex items-center justify-between px-4 py-3 hover:bg-[#394858]">
                    <span>Master Data</span> <span>></span>
                </button>
                <div id="masterDataMenu" class="hidden bg-[#242e39] py-2 pl-6">
                    <a href="#" class="block py-1 hover:text-white">Master Data Download</a>
                </div>
            </div>

            <div class="border-b border-gray-600">
                <button onclick="toggleMenu('uploaderMenu')" class="w-full flex items-center justify-between px-4 py-3 hover:bg-[#394858]">
                    <span>Uploader</span> <span>></span>
                </button>
                <div id="uploaderMenu" class="hidden bg-[#242e39] py-2 pl-6">
                    <a href="#" class="block py-1 hover:text-white">Live Call Upload</a>
                </div>
            </div>

            <div class="border-b border-gray-600">
                <button onclick="toggleMenu('reportsMenu')" class="w-full flex items-center justify-between px-4 py-3 hover:bg-[#394858]">
                    <span>Reports</span> <span>></span>
                </button>
                <div id="reportsMenu" class="hidden bg-[#242e39] py-2 pl-6">
                    <a href="#" class="block py-1 hover:text-white">Report Main</a>
                </div>
            </div>

            <div class="border-b border-gray-600">
                <button onclick="toggleMenu('usersMenu')" class="w-full flex items-center justify-between px-4 py-3 hover:bg-[#394858]">
                    <span>Users</span> <span>></span>
                </button>
                <div id="usersMenu" class="hidden bg-[#242e39] py-2 pl-6">
                    <a href="#" class="block py-1 hover:text-white">Create User</a>
                    <a href="#" class="block py-1 hover:text-white">Update User</a>
                </div>
            </div>

            <div class="border-b border-gray-600">
                <button onclick="toggleMenu('passwordMenu')" class="w-full flex items-center justify-between px-4 py-3 hover:bg-[#394858]">
                    <span>Password</span> <span>></span>
                </button>
                <div id="passwordMenu" class="hidden bg-[#242e39] py-2 pl-6">
                    <a href="#" class="block py-1 hover:text-white">Change Password</a>
                </div>
            </div>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="ml-64 p-8">
        <h1 class="text-2xl font-bold mb-6">Welcome to Super Admin Dashboard</h1>
        
        <!-- Franchise Master Section (Kept Functional) -->
        <div id="franchiseMasterSection" class="hidden bg-white p-6 rounded shadow">
            <h2 class="text-xl font-bold mb-4">Franchise Master</h2>
            <button onclick="alert('Open Add Franchise Form')" class="bg-blue-600 text-white px-4 py-2 rounded">Add New Franchise</button>
            <p class="mt-4 text-gray-600">List of franchises will appear here.</p>
        </div>
    </div>

    <script>
        function toggleMenu(id) {
            document.getElementById(id).classList.toggle('hidden');
        }
        function showSection(id) {
            // Hide all sections first
            document.getElementById('franchiseMasterSection').classList.add('hidden');
            // Show requested
            document.getElementById(id).classList.remove('hidden');
        }
    </script>
</body>
</html>
