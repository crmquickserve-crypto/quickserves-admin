<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Full Dashboard & CRM - Quickserves</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
</head>
<body class="bg-[#0f172a] font-sans text-[#f8fafc] min-h-screen flex">

    <div id="loginOverlay" class="fixed inset-0 z-50 bg-[#0f172a] flex items-center justify-center p-4" style="display: none;">
        <div class="bg-[#1e293b] border border-[#334155] rounded-xl shadow-2xl w-full max-w-md p-8">
            <div class="text-center mb-8">
                <span class="text-emerald-400 font-extrabold text-2xl tracking-wide">QUICKSERVES</span>
                <p class="text-slate-400 text-sm mt-2">Super Admin CRM Control Panel</p>
            </div>
            
            <form id="loginForm" onsubmit="handleSuperAdminLogin(event)" class="space-y-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Username</label>
                    <input type="text" id="adminUser" required placeholder="Enter username" 
                        class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="adminPass" required placeholder="••••••••" 
                        class="w-full bg-[#0f172a] border border-[#334155] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-sm">
                </div>
                <div id="loginError" class="text-red-400 text-xs hidden text-center font-medium">Invalid Username or Password!</div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition duration-200 text-sm shadow-lg shadow-emerald-900/40">
                    Login to Dashboard
                </button>
            </form>
        </div>
    </div>

    <div id="dashboardContent" style="display: none;" class="flex w-full min-h-screen">
        <div class="w-64 bg-[#1e293b] border-r border-[#334155] h-screen fixed left-0 top-0 overflow-y-auto z-20">
            <div class="p-4 bg-[#172033] border-b border-[#334155] flex items-center justify-between">
                <span class="text-emerald-400 font-bold text-lg tracking-wide">QUICKSERVES</span>
                <button onclick="handleLogout()" title="Logout" class="text-xs bg-red-500/20 text-red-400 hover:bg-red-500/30 px-2.5 py-1 rounded transition">Logout</button>
            </div>

            <nav class="py-2">
                <div class="px-4 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Navigation</div>
                <a href="#" class="block px-4 py-2.5 text-sm text-slate-200 hover:bg-slate-800 transition">Dashboard Overview</a>
                <a href="#" class="block px-4 py-2.5 text-sm text-slate-200 hover:bg-slate-800 transition">Client Masters</a>
                <a href="#" class="block px-4 py-2.5 text-sm text-slate-200 hover:bg-slate-800 transition">Service Areas</a>
                
                </nav>
        </div>

        <div class="ml-64 flex-1 p-8">
            <header class="flex justify-between items-center mb-8 bg-[#1e293b] p-4 rounded-xl border border-[#334155]">
                <h1 class="text-xl font-bold text-white">Super Admin Control Center</h1>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-slate-300">Pankaj Dhiman</span>
                    <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">Logout</button>
                </div>
            </header>

            <main>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-[#1e293b] p-6 rounded-xl border border-[#334155]">
                        <h3 class="text-slate-400 text-sm">Active Clients</h3>
                        <p class="text-2xl font-bold text-emerald-400 mt-2">1,248</p>
                    </div>
                    <div class="bg-[#1e293b] p-6 rounded-xl border border-[#334155]">
                        <h3 class="text-slate-400 text-sm">Service Calls Today</h3>
                        <p class="text-2xl font-bold text-blue-400 mt-2">84</p>
                    </div>
                    <div class="bg-[#1e293b] p-6 rounded-xl border border-[#334155]">
                        <h3 class="text-slate-400 text-sm">Active Technicians</h3>
                        <p class="text-2xl font-bold text-purple-400 mt-2">38</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        // Page load hote hi check karein ki user logged-in hai ya nahi
        document.addEventListener("DOMContentLoaded", function() {
            const isAuth = sessionStorage.getItem("quickserve_super_admin");
            if (isAuth === "true") {
                document.getElementById("dashboardContent").style.display = "flex";
                document.getElementById("loginOverlay").style.display = "none";
            } else {
                document.getElementById("loginOverlay").style.display = "flex";
                document.getElementById("dashboardContent").style.display = "none";
            }
        });

        // Login Handle karne ki function
        function handleSuperAdminLogin(event) {
            event.preventDefault();
            const u = document.getElementById("adminUser").value;
            const p = document.getElementById("adminPass").value;
            const err = document.getElementById("loginError");

            // Yahan aap apna Super Admin Username aur Password set kar sakte hain
            if (u === "admin" && p === "QuickServe@123") {
                sessionStorage.setItem("quickserve_super_admin", "true");
                document.getElementById("loginOverlay").style.display = "none";
                document.getElementById("dashboardContent").style.display = "flex";
                location.reload();
            } else {
                err.classList.remove("hidden");
            }
        }

        // Logout Handle karne ki function
        function handleLogout() {
            sessionStorage.removeItem("quickserve_super_admin");
            window.location.reload();
        }

        // Initialize Flatpickr Calendar for Date fields
        document.addEventListener("DOMContentLoaded", function() {
            if(typeof flatpickr !== 'undefined') {
                flatpickr(".calendar-input", {
                    dateFormat: "d/m/Y",
                    allowInput: true,
                    altInput: true,
                    altFormat: "d/m/Y"
                });
            }
        });
    </script>
</body>
</html>
