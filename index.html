<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Fill Address using PIN Code API</title>
    <!-- Bootstrap CSS for nice styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Address Form with Auto PIN Code</h4>
                    </div>
                    <div class="card-body">
                        <form id="addressForm">
                            <!-- PIN Code Field -->
                            <div class="mb-3">
                                <label for="pincode" class="form-label">PIN Code</label>
                                <input type="text" class="form-control" id="pincode" maxlength="6" placeholder="Enter 6-digit PIN code" required>
                                <div id="error-msg" class="text-danger small mt-1"></div>
                            </div>

                            <!-- Locality / Post Office Dropdown -->
                            <div class="mb-3">
                                <label for="locality" class="form-label">Locality / Area</label>
                                <select class="form-select" id="locality" required>
                                    <option value="">Select PIN code first</option>
                                </select>
                            </div>

                            <!-- City / District Field -->
                            <div class="mb-3">
                                <label for="city" class="form-label">City / District</label>
                                <input type="text" class="form-control" id="city" placeholder="Auto-filled city" readonly required>
                            </div>

                            <!-- State Field -->
                            <div class="mb-3">
                                <label for="state" class="form-label">State</label>
                                <input type="text" class="form-control" id="state" placeholder="Auto-filled state" readonly required>
                            </div>

                            <button type="submit" class="btn btn-success w-100">Submit Address</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript for API Integration -->
    <script>
        const pincodeInput = document.getElementById('pincode');
        const localitySelect = document.getElementById('locality');
        const cityInput = document.getElementById('city');
        const stateInput = document.getElementById('state');
        const errorMsg = document.getElementById('error-msg');

        pincodeInput.addEventListener('input', function() {
            let pincode = this.value.trim();

            // Clear fields if input is less than 6 digits
            if (pincode.length < 6) {
                localitySelect.innerHTML = '<option value="">Select PIN code first</option>';
                cityInput.value = '';
                stateInput.value = '';
                errorMsg.textContent = '';
            }

            // Jab 6 digits complete ho jayein
            if (pincode.length === 6) {
                errorMsg.textContent = 'Fetching details...';
                let apiUrl = `https://api.postalpincode.in/pincode/${pincode}`;

                fetch(apiUrl)
                    .then(response => response.json())
                    .then(data => {
                        if (data[0].Status === "Success") {
                            errorMsg.textContent = '';
                            let postOffices = data[0].PostOffice;

                            // City aur State common hote hain saare post offices ke liye ek hi PIN mein
                            cityInput.value = postOffices[0].District;
                            stateInput.value = postOffices[0].State;

                            // Locality dropdown options populate karna
                            localitySelect.innerHTML = '<option value="">Select Locality</option>';
                            postOffices.forEach(po => {
                                let option = document.createElement('option');
                                option.value = po.Name;
                                option.textContent = po.Name;
                                localitySelect.appendChild(option);
                            });
                        } else {
                            errorMsg.textContent = 'Invalid PIN Code! Please check.';
                            localitySelect.innerHTML = '<option value="">Invalid PIN Code</option>';
                            cityInput.value = '';
                            stateInput.value = '';
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        errorMsg.textContent = 'Failed to fetch data. Try again later.';
                    });
            }
        });
    </script>
</body>
</html>
