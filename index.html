<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>QUICKSERVES OS - Add Branch</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; }
    
    .sidebar { width: 280px; background-color: #1e293b; border-right: 1px solid #334155; overflow-y: auto; height: 100vh; position: fixed; }
    .sidebar-brand { font-size: 15px; font-weight: bold; color: #f8fafc; padding: 20px 16px; background: #172033; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #334155; }
    
    .menu-dropdown { border-bottom: 1px solid #334155; }
    .menu-header { padding: 14px 16px; color: #cbd5e1; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
    .menu-header:hover { background-color: #334155; color: #fff; }
    
    .submenu { display: none; background-color: #172033; padding: 4px 0; }
    .submenu.open { display: block; }
    .submenu-item { padding: 10px 16px 10px 42px; color: #94a3b8; font-size: 12px; cursor: pointer; transition: 0.2s; }
    .submenu-item:hover { color: #f8fafc; background-color: #1e293b; }
    .submenu-item.active { color: #818cf8; font-weight: 600; background-color: #1e293b; }

    .main { flex: 1; margin-left: 280px; padding: 32px; overflow-y: auto; }
    .header { font-size: 18px; font-weight: 700; color: #94a3b8; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    
    .panel-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 24px; }
    .section-title { font-size: 14px; font-weight: 600; color: #38bdf8; margin: 20px 0 12px 0; border-bottom: 1px solid #334155; padding-bottom: 6px; text-transform: uppercase; }
    
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 15px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; }
    input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 9px 12px; border-radius: 4px; font-size: 13px; }
    textarea { resize: vertical; height: 75px; }
    
    .btn-container { display: flex; gap: 10px; margin-top: 20px; }
    .btn-primary { background-color: #007bff; color: white; border: none; padding: 10px 24px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-primary:hover { background-color: #0056b3; }
    .btn-secondary { background-color: #007bff; color: white; border: none; padding: 10px 24px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-secondary:hover { background-color: #0056b3; }
  </style>
</head>
<body>

  <!-- ADMIN SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-brand">🏠 Admin Dashboard</div>

    <div class="menu-dropdown">
      <div class="menu-header" onclick="toggleSubmenu('masterSub')"><span>📄 Master</span> <span>▼</span></div>
      <div class="submenu open" id="masterSub">
        <div class="submenu-item active" onclick="switchView('Branch Master')">Branch Master</div>
        <div class="submenu-item" onclick="switchView('Franchise Master')">Franchise Master</div>
        <div class="submenu-item" onclick="switchView('Freelancer Master')">Freelancer Master</div>
        <div class="submenu-item" onclick="switchView('Technician Master')">Technician Master</div>
        <div class="submenu-item" onclick="switchView('Brand Mapping')">Brand Mapping</div>
        <div class="submenu-item" onclick="switchView('Category Mapping')">Category Mapping</div>
        <div class="submenu-item" onclick="switchView('Pincode Mapping')">Pincode Mapping</div>
        <div class="submenu-item" onclick="switchView('Client Master')">Client Master</div>
        <div class="submenu-item" onclick="switchView('Brand Master')">Brand Master</div>
        <div class="submenu-item" onclick="switchView('Category Master')">Category Master</div>
        <div class="submenu-item" onclick="switchView('Product Master')">Product Master</div>
        <div class="submenu-item" onclick="switchView('Model Master')">Model Master</div>
        <div class="submenu-item" onclick="switchView('Symptom Master')">Symptom Master</div>
        <div class="submenu-item" onclick="switchView('Cause Master')">Cause Master</div>
      </div>
    </div>
  </div>

  <!-- MAIN AREA -->
  <div class="main">
    <div class="header">Add Branch</div>
    <div class="panel-card">
      <form id="addBranchForm" onsubmit="saveBranch(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Region</label>
            <select id="region" required>
              <option value="">----Select----</option>
              <option value="North">North</option>
              <option value="South">South</option>
              <option value="East">East</option>
              <option value="West">West</option>
            </select>
          </div>
          <div class="form-group">
            <label>Branch</label>
            <input type="text" id="branch_name" placeholder="Enter Branch Name" required>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Address</label>
            <textarea id="address" placeholder="Enter Full Address"></textarea>
          </div>
          <div class="form-group">
            <label>Landmark</label>
            <input type="text" id="landmark" placeholder="Enter Landmark">
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Pincode</label>
            <input type="text" id="pincode" placeholder="Enter Pincode">
          </div>
          <div class="form-group">
            <label>State</label>
            <select id="state">
              <option value="">----Select----</option>
              <option value="Delhi">Delhi</option>
              <option value="Uttar Pradesh">Uttar Pradesh</option>
              <option value="Haryana">Haryana</option>
            </select>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>District</label>
            <select id="district">
              <option value="">----Select----</option>
              <option value="New Delhi">New Delhi</option>
              <option value="Ghaziabad">Ghaziabad</option>
              <option value="Noida">Noida</option>
            </select>
          </div>
          <div class="form-group">
            <label>City</label>
            <select id="city">
              <option value="">----Select----</option>
              <option value="Delhi">Delhi</option>
              <option value="Ghaziabad">Ghaziabad</option>
              <option value="Noida">Noida</option>
            </select>
          </div>
        </div>

        <div class="form-group" style="width: 50%; padding-right: 10px;">
          <label>Locality</label>
          <select id="locality">
            <option value="">----Select----</option>
          </select>
        </div>

        <div class="section-title">Gst Details</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Shop & Establishment Registration</label>
            <input type="text" id="shop_reg" placeholder="Enter Registration No">
          </div>
          <div class="form-group">
            <label>GST Number</label>
            <input type="text" id="gst_no" placeholder="Enter GST Number">
          </div>
        </div>

        <div class="btn-container">
          <button type="submit" class="btn-primary">Save</button>
          <button type="reset" class="btn-secondary">Reset</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://uknhaaxrzuzoxoifocsh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_MzqXS2rfG9-axSCwX3MYtQ_23dbTkG9';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function toggleSubmenu(id) {
      document.getElementById(id).classList.toggle('open');
    }

    function switchView(title) {
      alert("Switched to " + title);
    }

    async function saveBranch(event) {
      event.preventDefault();
      
      const branchData = {
        region: document.getElementById('region').value,
        branch_name: document.getElementById('branch_name').value,
        address: document.getElementById('address').value,
        landmark: document.getElementById('landmark').value,
        pincode: document.getElementById('pincode').value,
        state: document.getElementById('state').value,
        district: document.getElementById('district').value,
        city: document.getElementById('city').value,
        locality: document.getElementById('locality').value,
        shop_registration: document.getElementById('shop_reg').value,
        gst_number: document.getElementById('gst_no').value
      };

      const { data, error } = await db.from('branches').insert([branchData]);

      if (error) {
        alert('Error saving branch: ' + error.message);
      } else {
        alert('Branch added successfully!');
        document.getElementById('addBranchForm').reset();
      }
    }
  </script>
</body>
</html>
